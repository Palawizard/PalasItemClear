name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-root:
    name: Minecraft 1.20.1 Forge and Fabric
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Upload loader artifacts
        uses: actions/upload-artifact@v7
        with:
          name: palas-item-clear-1.20.1
          path: |
            fabric/build/libs/palas-item-clear-1.20.1-fabric-*.jar
            forge/build/libs/palas-item-clear-1.20.1-forge-*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev-shadow.jar
            !forge/build/libs/*-sources.jar
            !forge/build/libs/*-dev-shadow.jar
          if-no-files-found: error

  build-band:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Minecraft 1.20.1 NeoForge
            path: versions/1.20.1-neoforge
            artifact: palas-item-clear-1.20.1-neoforge
          - label: Minecraft 1.20.4 Fabric
            path: versions/1.20.4-fabric
            artifact: palas-item-clear-1.20.4-fabric
          - label: Minecraft 1.20.4 Forge
            path: versions/1.20.4-forge
            artifact: palas-item-clear-1.20.4-forge
          - label: Minecraft 1.20.4 NeoForge
            path: versions/1.20.4-neoforge
            artifact: palas-item-clear-1.20.4-neoforge
          - label: Minecraft 1.20.6 Fabric
            path: versions/1.20.6-fabric
            artifact: palas-item-clear-1.20.6-fabric
          - label: Minecraft 1.20.6 Forge
            path: versions/1.20.6-forge
            artifact: palas-item-clear-1.20.6-forge
          - label: Minecraft 1.20.6 NeoForge
            path: versions/1.20.6-neoforge
            artifact: palas-item-clear-1.20.6-neoforge
          - label: Minecraft 1.21.1 Fabric
            path: versions/1.21.1-fabric
            artifact: palas-item-clear-1.21.1-fabric
          - label: Minecraft 1.21.1 Forge
            path: versions/1.21.1-forge
            artifact: palas-item-clear-1.21.1-forge
          - label: Minecraft 1.21.1 NeoForge
            path: versions/1.21.1-neoforge
            artifact: palas-item-clear-1.21.1-neoforge
          - label: Minecraft 1.21.10 Fabric
            path: versions/1.21.10-fabric
            artifact: palas-item-clear-1.21.10-fabric
          - label: Minecraft 1.21.10 Forge
            path: versions/1.21.10-forge
            artifact: palas-item-clear-1.21.10-forge
          - label: Minecraft 1.21.10 NeoForge
            path: versions/1.21.10-neoforge
            artifact: palas-item-clear-1.21.10-neoforge
          - label: Minecraft 1.21.11 Fabric
            path: versions/1.21.11-fabric
            artifact: palas-item-clear-1.21.11-fabric
          - label: Minecraft 1.21.11 Forge
            path: versions/1.21.11-forge
            artifact: palas-item-clear-1.21.11-forge
          - label: Minecraft 1.21.11 NeoForge
            path: versions/1.21.11-neoforge
            artifact: palas-item-clear-1.21.11-neoforge
          - label: Minecraft 26.2 Fabric
            path: versions/26.2-fabric
            artifact: palas-item-clear-26.2-fabric
          - label: Minecraft 26.2 Forge
            path: versions/26.2-forge
            artifact: palas-item-clear-26.2-forge
          - label: Minecraft 26.2 NeoForge
            path: versions/26.2-neoforge
            artifact: palas-item-clear-26.2-neoforge
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Install every JDK a band might target. Gradle runs on Java 21 (Gradle 8.12
      # cannot run on Java 25) and compiles each band with the matching toolchain.
      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Use each band's own Gradle wrapper: the newest bands pin Gradle 9.5.1 for
      # ForgeGradle 7 and recent Loom, while older bands stay on 8.12.
      - name: Build and test
        working-directory: ${{ matrix.path }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew clean build --no-daemon \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload loader artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}/build/libs/${{ matrix.artifact }}-*.jar
          if-no-files-found: error

  verify-artifacts:
    name: Verify release artifacts
    needs: [build-root, build-band]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download built artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: palas-item-clear-*
          merge-multiple: true

      - name: Verify packaged artifacts
        shell: pwsh
        run: ./scripts/check-release-artifacts.ps1 -ArtifactsRoot release

  smoke-all:
    name: Dedicated servers (all bands, real JARs)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Installs each loader's real dedicated server, drops the packaged JAR plus
      # companions, boots it, and asserts the item clearing scheduler starts and stops.
      # Heavy and network-bound, so it runs on demand rather than on every push.
      - name: Smoke-test every supported band and loader on a real server
        shell: pwsh
        run: ./scripts/prod-smoke-all.ps1

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-root, build-band, verify-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify tag matches mod version
        run: |
          version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version"; exit 1
          fi

      - name: Verify release notes exist
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "Release notes file not found: $notes. Add it before tagging."; exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: palas-item-clear-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Pala's Item Clear - ${{ github.ref_name }}"
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: release/**/*.jar
          prerelease: false
          fail_on_unmatched_files: true

  # Publishes one version per Minecraft line and loader (a single file each) to Modrinth
  # and CurseForge, so every store entry maps to exactly one loader with the right
  # dependencies. Runs only after a successful release and only when the project IDs are
  # configured, so it stays dormant until the stores are set up. One-time setup: create
  # the projects, then add repository variables MODRINTH_ID / CURSEFORGE_ID and secrets
  # MODRINTH_TOKEN / CURSEFORGE_TOKEN.
  publish-mods:
    name: Publish ${{ matrix.band.label }} ${{ matrix.loader }} to mod stores
    needs: [release]
    if: ${{ vars.MODRINTH_ID != '' || vars.CURSEFORGE_ID != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        loader: [forge, fabric, neoforge]
        band:
          - { label: '1.20.1', target: '1.20.1', gameVersions: '1.20.1' }
          - { label: '1.20.2-1.20.4', target: '1.20.4', gameVersions: '1.20.2, 1.20.3, 1.20.4' }
          - { label: '1.20.5-1.20.6', target: '1.20.6', gameVersions: '1.20.5, 1.20.6' }
          - { label: '1.21-1.21.4', target: '1.21.1', gameVersions: '1.21, 1.21.1, 1.21.2, 1.21.3, 1.21.4' }
          - { label: '1.21.5-1.21.10', target: '1.21.10', gameVersions: '1.21.5, 1.21.6, 1.21.7, 1.21.8, 1.21.9, 1.21.10' }
          - { label: '1.21.11', target: '1.21.11', gameVersions: '1.21.11' }
          - { label: '26.1-26.2', target: '26.2', gameVersions: '26.1, 26.2' }
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: palas-item-clear-*
          merge-multiple: true

      - name: Prepare publish metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          {
            echo "gameVersions<<GV_EOF"
            echo "${{ matrix.band.gameVersions }}" | tr ',' '\n' | tr -d ' '
            echo "GV_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish ${{ matrix.band.label }} ${{ matrix.loader }}
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release/**/palas-item-clear-${{ matrix.band.target }}-${{ matrix.loader }}-*.jar
          name: "Pala's Item Clear ${{ matrix.band.label }} (${{ matrix.loader }}) - ${{ github.ref_name }}"
          version: "${{ steps.meta.outputs.version }}+${{ matrix.band.target }}-${{ matrix.loader }}"
          version-type: release
          changelog-file: .github/release-notes/${{ github.ref_name }}.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ steps.meta.outputs.gameVersions }}
          retry-attempts: 2

  # mc-publish cannot set Modrinth's new per-version environment field and does
  # not map the "architectury" mod id to its Modrinth project, so freshly
  # published versions come out as environment "unknown" and the Architectury-based
  # 1.20.1 Forge/Fabric line ships without its required Architectury API dependency.
  # This step fixes both through the Modrinth v3 API for every version of this release.
  finalize-modrinth-metadata:
    name: Finalize Modrinth version metadata
    needs: [publish-mods]
    if: ${{ vars.MODRINTH_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Set environment and 1.20.1 dependencies
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "MODRINTH_TOKEN is not set; skipping Modrinth metadata finalization."
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          api="https://api.modrinth.com/v3"
          # Fixed Modrinth project ids for the companions the 1.20.1 (Architectury) line requires; mc-publish maps fabric-api but not architectury.
          fabric_api="P7dR8mSH"
          architectury="lhGA9TYQ"
          echo "Finalizing Modrinth metadata for release ${version}"
          versions="$(curl -fsS -H "Authorization: ${MODRINTH_TOKEN}" "${api}/project/${MODRINTH_ID}/version")"
          failed=0
          while read -r id vnum; do
            case "$vnum" in
              *"+1.20.1-fabric") body="$(jq -nc --arg fa "$fabric_api" --arg ar "$architectury" '{environment:"server_only",dependencies:[{project_id:$fa,dependency_type:"required"},{project_id:$ar,dependency_type:"required"}]}')" ;;
              *"+1.20.1-forge") body="$(jq -nc --arg ar "$architectury" '{environment:"server_only",dependencies:[{project_id:$ar,dependency_type:"required"}]}')" ;;
              *) body='{"environment":"server_only"}' ;;
            esac
            code="$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH "${api}/version/${id}" -H "Authorization: ${MODRINTH_TOKEN}" -H 'Content-Type: application/json' -d "$body")"
            echo "  HTTP ${code}  ${vnum}"
            if [ "$code" != "204" ]; then
              echo "::error::Failed to update ${vnum} (HTTP ${code})"
              failed=1
            fi
          done < <(printf '%s' "$versions" | jq -r --arg v "$version" '.[] | select(.version_number | startswith($v + "+")) | [.id, .version_number] | join(" ")')
          if [ "$failed" -ne 0 ]; then
            echo "One or more Modrinth versions could not be finalized."
            exit 1
          fi
          echo "All ${version} Modrinth versions set to server_only; 1.20.1 Architectury deps re-added."
