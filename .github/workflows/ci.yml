name: Build and release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-1-20-1:
    name: Minecraft 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Upload loader artifacts
        uses: actions/upload-artifact@v7
        with:
          name: palas-item-clear-1.20.1
          path: |
            fabric/build/libs/palas-item-clear-1.20.1-fabric-*.jar
            forge/build/libs/palas-item-clear-1.20.1-forge-*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev-shadow.jar
            !forge/build/libs/*-sources.jar
            !forge/build/libs/*-dev-shadow.jar
          if-no-files-found: error

  smoke-1-20-1:
    name: Dedicated servers 1.20.1
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Smoke-test Forge and Fabric
        shell: pwsh
        run: ./scripts/smoke-test-servers.ps1

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-1-20-1, smoke-1-20-1]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: palas-item-clear-*
          path: release
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.jar --generate-notes --verify-tag
