name: Build and release

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-root:
    name: Minecraft 1.20.1 Forge and Fabric
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Upload loader artifacts
        uses: actions/upload-artifact@v7
        with:
          name: palas-item-clear-1.20.1
          path: |
            fabric/build/libs/palas-item-clear-1.20.1-fabric-*.jar
            forge/build/libs/palas-item-clear-1.20.1-forge-*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-dev-shadow.jar
            !forge/build/libs/*-sources.jar
            !forge/build/libs/*-dev-shadow.jar
          if-no-files-found: error

  build-band:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Minecraft 1.20.1 NeoForge
            path: versions/1.20.1-neoforge
            java: 17
            artifact: palas-item-clear-1.20.1-neoforge
          - label: Minecraft 1.20.4 Fabric
            path: versions/1.20.4-fabric
            java: 17
            artifact: palas-item-clear-1.20.4-fabric
          - label: Minecraft 1.20.4 Forge
            path: versions/1.20.4-forge
            java: 17
            artifact: palas-item-clear-1.20.4-forge
          - label: Minecraft 1.20.4 NeoForge
            path: versions/1.20.4-neoforge
            java: 17
            artifact: palas-item-clear-1.20.4-neoforge
          - label: Minecraft 1.20.6 Fabric
            path: versions/1.20.6-fabric
            java: 21
            artifact: palas-item-clear-1.20.6-fabric
          - label: Minecraft 1.20.6 Forge
            path: versions/1.20.6-forge
            java: 21
            artifact: palas-item-clear-1.20.6-forge
          - label: Minecraft 1.20.6 NeoForge
            path: versions/1.20.6-neoforge
            java: 21
            artifact: palas-item-clear-1.20.6-neoforge
          - label: Minecraft 1.21.1 Fabric
            path: versions/1.21.1-fabric
            java: 21
            artifact: palas-item-clear-1.21.1-fabric
          - label: Minecraft 1.21.1 Forge
            path: versions/1.21.1-forge
            java: 21
            artifact: palas-item-clear-1.21.1-forge
          - label: Minecraft 1.21.1 NeoForge
            path: versions/1.21.1-neoforge
            java: 21
            artifact: palas-item-clear-1.21.1-neoforge
          - label: Minecraft 1.21.10 Fabric
            path: versions/1.21.10-fabric
            java: 21
            artifact: palas-item-clear-1.21.10-fabric
          - label: Minecraft 1.21.10 Forge
            path: versions/1.21.10-forge
            java: 21
            artifact: palas-item-clear-1.21.10-forge
          - label: Minecraft 1.21.10 NeoForge
            path: versions/1.21.10-neoforge
            java: 21
            artifact: palas-item-clear-1.21.10-neoforge
          - label: Minecraft 1.21.11 Fabric
            path: versions/1.21.11-fabric
            java: 21
            artifact: palas-item-clear-1.21.11-fabric
          - label: Minecraft 1.21.11 Forge
            path: versions/1.21.11-forge
            java: 21
            artifact: palas-item-clear-1.21.11-forge
          - label: Minecraft 1.21.11 NeoForge
            path: versions/1.21.11-neoforge
            java: 21
            artifact: palas-item-clear-1.21.11-neoforge
          - label: Minecraft 26.2 Fabric
            path: versions/26.2-fabric
            java: 25
            artifact: palas-item-clear-26.2-fabric
          - label: Minecraft 26.2 Forge
            path: versions/26.2-forge
            java: 25
            artifact: palas-item-clear-26.2-forge
          - label: Minecraft 26.2 NeoForge
            path: versions/26.2-neoforge
            java: 25
            artifact: palas-item-clear-26.2-neoforge
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew -p ${{ matrix.path }} clean build --no-daemon

      - name: Upload loader artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}/build/libs/${{ matrix.artifact }}-*.jar
          if-no-files-found: error

  smoke-all:
    name: Dedicated servers (all bands, real JARs)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Installs each loader's real dedicated server, drops the packaged release JAR
      # plus required companions, boots it and asserts the item clearing scheduler
      # starts and stops. This exercises the artifact players install, so results do
      # not depend on dev-run (gradlew runServer) toolchain quirks.
      - name: Smoke-test every supported band and loader on a real server
        shell: pwsh
        run: ./scripts/prod-smoke-all.ps1

  verify-artifacts:
    name: Verify release artifacts
    needs: [build-root, build-band]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build every supported line
        shell: pwsh
        run: ./scripts/build-all-version-bands.ps1 -SkipSmoke

      - name: Verify packaged artifacts
        shell: pwsh
        run: ./scripts/check-release-artifacts.ps1 -SkipBuild

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-root, build-band, smoke-all, verify-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release
          pattern: palas-item-clear-*
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.jar --generate-notes --verify-tag
