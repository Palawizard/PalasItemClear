name: Feature request
description: Suggest an improvement or new capability for Palas Item Clear
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to achieve, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, command, or configuration you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or existing options you have tried.
  - type: dropdown
    id: scope
    attributes:
      label: Affected loaders
      multiple: true
      options:
        - Forge
        - Fabric
        - NeoForge
        - All loaders
