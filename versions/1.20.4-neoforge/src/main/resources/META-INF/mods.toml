modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Palawi"
description = '''
Automatically removes dropped items after configurable warnings.
'''

displayTest = "IGNORE_SERVER_VERSION"

# NeoForge 20.2-20.3 (FML 1.x) only read "mandatory"; 20.4 and newer read "type".
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
mandatory = true
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "SERVER"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "SERVER"

[features.${mod_id}]
javaVersion = "[17,)"
