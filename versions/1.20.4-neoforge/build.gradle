plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

apply from: '../shared/sync-shared-sources.gradle'

version = mod_version
group = mod_group_id

base {
    archivesName = "palas-item-clear-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_release.toInteger())

configureSharedSourceSets()

neoForge {
    version = project.neo_version
    validateAccessTransformers = true

    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        palasitemclear {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_release.toInteger()
}

tasks.named('test') {
    enabled = false
}

tasks.named('compileTestJava') {
    enabled = false
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes(
                'Implementation-Title': 'palas-item-clear',
                'Implementation-Version': project.version,
                'Minecraft-Version': minecraft_version
        )
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replacements = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license
    ]
    inputs.properties replacements
    // NeoForge 20.4 (MC 1.20.4) still reads META-INF/mods.toml; the neoforge.mods.toml
    // filename was only introduced in NeoForge 20.5.
    filesMatching('META-INF/mods.toml') {
        expand replacements
    }
}
