plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

apply from: '../shared/sync-shared-sources.gradle'

version = mod_version
group = mod_group_id

base {
    archivesName = "palas-item-clear-${minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_release.toInteger())

configureSharedSourceSets()

legacyForge {
    enable {
        neoForgeVersion = neo_version
    }
    validateAccessTransformers = true
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        palasitemclear {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_release.toInteger()
}

tasks.named('test') {
    enabled = false
}

tasks.named('compileTestJava') {
    enabled = false
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes(
                'Implementation-Title': 'palas-item-clear',
                'Implementation-Version': project.version,
                'Minecraft-Version': minecraft_version
        )
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replacements = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license
    ]
    inputs.properties replacements
    // Legacy NeoForge for 1.20.1 reads META-INF/mods.toml; the pattern must match the
    // actual file name or placeholders ship unexpanded and mod scanning crashes.
    filesMatching('META-INF/mods.toml') {
        expand replacements
    }
}
